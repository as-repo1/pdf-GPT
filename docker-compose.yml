# pdf-GPT — Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Quick start:
#   docker compose up                        # pdf-GPT only (use external Ollama / cloud APIs)
#   docker compose --profile ollama up       # pdf-GPT + bundled Ollama
#
# Then open: http://localhost:1212
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── pdf-GPT API Backend ─────────────────────────────────────────────────────
  pdf-gpt-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: pdf-gpt:latest
    container_name: pdf-gpt-api
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "1212"]
    ports:
      - "1212:1212"
    volumes:
      - pdf-gpt-config:/root
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
    networks:
      - pdf-gpt-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1212/api/config"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3


  # ── Ollama (local LLM) — opt-in via --profile ollama ────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - pdf-gpt-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

# ── Named volumes ──────────────────────────────────────────────────────────────
volumes:
  pdf-gpt-config:
    driver: local
  ollama-models:
    driver: local

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  pdf-gpt-net:
    driver: bridge
